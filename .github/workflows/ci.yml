name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gotonghr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gotonghr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_PASSWORD: postgres
      MIGRATOR_PASSWORD: migrator
      APP_PASSWORD: app
      PLATFORM_PASSWORD: platform
      QUEUE_PASSWORD: queue
      DATABASE_URL_SUPERUSER: postgres://postgres:postgres@127.0.0.1:5432/gotonghr
      DATABASE_URL_MIGRATOR: postgres://gotong_migrator:migrator@127.0.0.1:5432/gotonghr
      DATABASE_URL_APP: postgres://app_tenant:app@127.0.0.1:5432/gotonghr
      DATABASE_URL_PLATFORM: postgres://platform_admin:platform@127.0.0.1:5432/gotonghr
      DATABASE_URL_QUEUE: postgres://gotong_queue:queue@127.0.0.1:5432/gotonghr
      STORAGE_DRIVER: local
      STORAGE_LOCAL_SECRET: ci-storage-secret-0123456789abcdef
      QUEUE_DRIVER: pgboss
      GOTONG_ROLE: monolith
      GOTONG_DEPLOYMENT_MODE: single_tenant
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Require Node 22.13 or newer
        run: node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 13)) process.exit(1)'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec depcruise --config tooling/arch-tests/.dependency-cruiser.cjs packages apps
