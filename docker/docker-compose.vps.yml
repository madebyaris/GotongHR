# postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
name: gotonghr

services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    entrypoint: ["/bin/sh", "/usr/local/bin/gotong-postgres-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: gotonghr
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres.vps.conf:/etc/postgresql/postgres.vps.conf:ro
      - ./postgres-entrypoint.sh:/usr/local/bin/gotong-postgres-entrypoint.sh:ro
    shm_size: 256mb
    mem_limit: 768m
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gotonghr"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: ["node", "dist/entrypoints/migrate.js"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: gotonghr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Set MIGRATOR_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
      PLATFORM_PASSWORD: ${PLATFORM_PASSWORD:?Set PLATFORM_PASSWORD}
      QUEUE_PASSWORD: ${QUEUE_PASSWORD:?Set QUEUE_PASSWORD}
    mem_limit: 256m
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: gotonghr
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
      PLATFORM_PASSWORD: ${PLATFORM_PASSWORD:?Set PLATFORM_PASSWORD}
      QUEUE_PASSWORD: ${QUEUE_PASSWORD:?Set QUEUE_PASSWORD}
      GOTONG_ROLE: monolith
      GOTONG_DEPLOYMENT_MODE: ${GOTONG_DEPLOYMENT_MODE:-single_tenant}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      # Public browser origin. Caddy is http://localhost, not the API bind address.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL to the public browser origin}
      GOTONG_TRUSTED_ORIGINS: ${GOTONG_TRUSTED_ORIGINS:-}
      GOTONG_TRUST_PROXY: ${GOTONG_TRUST_PROXY:-1}
      GOTONG_TRUST_CLOUDFLARE: ${GOTONG_TRUST_CLOUDFLARE:-false}
      GOTONG_AUTH_RATE_LIMIT_MAX: ${GOTONG_AUTH_RATE_LIMIT_MAX:-10}
      GOTONG_AUTH_RATE_LIMIT_WINDOW_MS: ${GOTONG_AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      QUEUE_DRIVER: ${QUEUE_DRIVER:-pgboss}
      STORAGE_LOCAL_SECRET: ${STORAGE_LOCAL_SECRET:?Set STORAGE_LOCAL_SECRET}
      NODE_OPTIONS: --max-old-space-size=512
      PORT: "3000"
      HOST: 0.0.0.0
    volumes:
      - api_data:/app/.data
    mem_limit: 640m
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  caddy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    mem_limit: 64m
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  api_data:
