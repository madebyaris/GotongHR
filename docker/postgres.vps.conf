# 2 GB VPS profile. The 1 GB override passes tighter -c values.
# io_method = io_uring is not set. It needs a loosened Docker seccomp
# profile and is a container escape risk. Opt in only by replacing this
# value and adding security_opt: ["seccomp:unconfined"] on the service.
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_connections = 40
wal_buffers = 8MB
random_page_cost = 1.1
io_method = worker
